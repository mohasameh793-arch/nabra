<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nabra pill</title>
<link rel="stylesheet" href="pill.css">
</head>
<body>
  <!-- Idle: a thin outlined capsule. Hover: two small separate buttons (mic; record + ›) with one-line tips. -->
  <div class="dock" id="dock">
    <div class="panel" id="panel" hidden></div>
    <div class="capsule" id="capsule"></div>
    <div class="stack" id="stack">
      <div class="row">
        <span class="tip" id="tip-mic">Dictate <b id="key-talk">Right Ctrl</b> <span class="badge" id="dialect" title="Arabic dialect of your last dictation" hidden></span></span>
        <button class="btn mic" id="mic" aria-label="Dictate" data-tip="tip-mic">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="row">
        <span class="tip" id="tip-notes"><span id="notes-label">Start notes</span> <b id="key-notes">Ctrl+Alt+N</b></span>
        <span class="tip" id="tip-cal">Upcoming meetings</span>
        <button class="chev" id="chev" aria-label="Upcoming meetings" data-tip="tip-cal">‹</button>
        <button class="btn rec" id="notes" aria-label="Start notes" data-tip="tip-notes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke-width="2"/><circle class="core" cx="12" cy="12" r="4.2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Listening / transcribing: the capsule with a live voice meter, or a spinner (like Flow) -->
  <div class="wave" id="wave" role="status" aria-label="Listening">
    <div class="lines" id="lines"></div>
    <span class="spin" aria-hidden="true"></span>
  </div>

  <!-- An answer card: what was playing, a catch-up, or an answer from past calls -->
  <div class="reveal" id="reveal" role="status" aria-live="polite">
    <b id="reveal-title" dir="auto"></b>
    <div class="reveal-text" id="reveal-text" dir="auto"></div>
    <div class="reveal-actions">
      <button id="reveal-open" hidden>Open in notes</button>
      <button id="reveal-copy">Copy</button>
      <button class="x" id="reveal-close" aria-label="Close">✕</button>
    </div>
  </div>

  <!-- Everything else: a horizontal pill -->
  <div class="bar" id="bar" role="status" aria-live="polite">
    <button class="stop" id="stop" aria-label="Stop" hidden><span></span></button>
    <span class="dot" id="dot" aria-hidden="true"></span>
    <span class="clock" id="clock"></span>
    <span class="msg" id="msg" dir="auto"></span>
    <span class="detail" id="detail"></span>
    <button class="take" id="take" hidden>Take notes</button>
    <button class="dismiss" id="dismiss" aria-label="Dismiss" hidden>✕</button>
  </div>
  <script src="pill.js"></script>
</body>
</html>
